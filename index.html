0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z\"\n            />\n          </svg>\n          Issues & Requests\n        </button>\n        <button class=\"upload-btn\" id=\"upload-btn\">\n          <svg\n            viewBox=\"0 0 24 24\"\n            style=\"fill: white; width: 16px; height: 16px\"\n          >\n            <path d=\"M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z\" />\n          </svg>\n          Upload MP3\n        </button>\n        <input\n          type=\"file\"\n          id=\"file-input\"\n          accept=\".mp3,audio/mpeg\"\n          style=\"display: none\"\n          multiple\n        />\n        <p\n          style=\"\n            opacity: 0.7;\n            color: white;\n            font-family: &quot;Spotify Mix&quot;;\n            margin-right: 5px;\n          \"\n        >\n          made by plankton\n        </p>\n      </div>\n    </header>\n    <main>\n      <div class=\"your-library\">\n        <div class=\"top-thingy\">\n          <p style=\"font-weight: bold\">Your Library</p>\n          <button class=\"create\" id=\"create-btn\">\n            <svg\n              data-encore-id=\"icon\"\n              role=\"img\"\n              aria-hidden=\"true\"\n              class=\"add\"\n              viewBox=\"0 0 16 16\"\n            >\n              <path\n                d=\"M15.25 8a.75.75 0 0 1-.75.75H8.75v5.75a.75.75 0 0 1-1.5 0V8.75H1.5a.75.75 0 0 1 0-1.5h5.75V1.5a.75.75 0 0 1 1.5 0v5.75h5.75a.75.75 0 0 1 .75.75\"\n              ></path>\n            </svg>\n            Create\n          </button>\n        </div>\n        <div id=\"playlists-container\"></div>\n      </div>\n      <div class=\"songs-stuff\" id=\"songs-stuff\">\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">New Additions</h1>\n            <p class=\"show-all-btn\" data-cat=\"new\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-new\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-new\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-new\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">All Artists</h1>\n            <p class=\"show-all-btn\" data-cat=\"artists\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-artists\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-artists\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-artists\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">All Albums & Singles</h1>\n            <p class=\"show-all-btn\" data-cat=\"albums\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-albums\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-albums\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-albums\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">User Uploaded</h1>\n            <p class=\"show-all-btn\" data-cat=\"uploaded\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-uploaded\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-uploaded\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-uploaded\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n      </div>\n    </main>\n\n    <script>\n      let allSongsRN = [];\n      let playlists = JSON.parse(\n        localStorage.getItem(\"shittify-playlists\") || \"[]\",\n      );\n      let metaJson = { songs: [], albums: [], profiles: [] };\n      let currentAudio;\n      let allNewSongs = [];\n      // FIX 1: separate full list (unsliced) for \"Show all\" on New Additions\n      let allNewSongsFull = [];\n      let allArtists = [];\n      let allAlbums = [];\n      // FIX 2: separate full shuffled list for \"Show all\" on Albums & Singles\n      let allAlbumsFull = [];\n      let allUploaded = [];\n      let db;\n\n      alert(\n        \"HEY!!! THIS IS IN VERY EARLY BETA, THERE ARENT MANY SONGS/ALBUMS RECCOMEND ME SOME TO ADD IN ISSUES AND REQUESTS IN THE TOP RIGHT, ALSO NOT VERY SIMILAR TO SPOTIFY AS ION USE IT. BTW loading songs on first load will take a while BE PATIENT have fun\",\n      );\n\n      window.addEventListener(\"load\", () => {\n        const splash = document.getElementById(\"splash\");\n        setTimeout(() => {\n          splash.classList.add(\"fade-out\");\n          setTimeout(() => splash.remove(), 650);\n        }, 1400);\n      });\n\n      function savePlaylists() {\n        localStorage.setItem(\"shittify-playlists\", JSON.stringify(playlists));\n      }\n\n      function openDB() {\n        return new Promise((resolve, reject) => {\n          const req = indexedDB.open(\"shittify-uploads\", 1);\n          req.onupgradeneeded = (e) => {\n            const d = e.target.result;\n            if (!d.objectStoreNames.contains(\"songs\")) {\n              d.createObjectStore(\"songs\", { keyPath: \"id\" });\n            }\n          };\n          req.onsuccess = (e) => resolve(e.target.result);\n          req.onerror = (e) => reject(e.target.error);\n        });\n      }\n\n      function dbGetAll() {\n        return new Promise((resolve, reject) => {\n          const tx = db.transaction(\"songs\", \"readonly\");\n          const store = tx.objectStore(\"songs\");\n          const req = store.getAll();\n          req.onsuccess = () => resolve(req.result);\n          req.onerror = (e) => reject(e.target.error);\n        });\n      }\n\n      function dbPut(song) {\n        return new Promise((resolve, reject) => {\n          const tx = db.transaction(\"songs\", \"readwrite\");\n          const store = tx.objectStore(\"songs\");\n          const req = store.put(song);\n          req.onsuccess = () => resolve();\n          req.onerror = (e) => reject(e.target.error);\n        });\n      }\n\n      function setupArrowButtons() {\n        document.querySelectorAll(\".arrow-btn\").forEach((btn) => {\n          btn.addEventListener(\"click\", () => {\n            const targetId = btn.dataset.target;\n            const cards = document.getElementById(targetId);\n            if (!cards) return;\n            const scrollAmount = 191.5 * 3;\n            if (btn.classList.contains(\"arrow-left\")) {\n              cards.scrollLeft -= scrollAmount;\n            } else {\n              cards.scrollLeft += scrollAmount;\n            }\n            setTimeout(() => updateArrowStates(cards), 320);\n          });\n        });\n\n        document.querySelectorAll(\".cards\").forEach((cards) => {\n          cards.addEventListener(\"scroll\", () => updateArrowStates(cards));\n          updateArrowStates(cards);\n        });\n      }\n\n      function updateArrowStates(cards) {\n        const wrapper = cards.closest(\".cards-wrapper\");\n        if (!wrapper) return;\n        const leftBtn = wrapper.querySelector(\".arrow-left\");\n        const rightBtn = wrapper.querySelector(\".arrow-right\");\n        const atStart = cards.scrollLeft <= 2;\n        const atEnd =\n          cards.scrollLeft + cards.clientWidth >= cards.scrollWidth - 2;\n        if (leftBtn) leftBtn.disabled = atStart;\n        if (rightBtn) rightBtn.disabled = atEnd;\n      }\n\n      function shuffle(array) {\n        const arr = [...array];\n        for (let i = arr.length - 1; i > 0; i--) {\n          const j = Math.floor(Math.random() * (i + 1));\n          [arr[i], arr[j]] = [arr[j], arr[i]];\n        }\n        return arr;\n      }\n\n      function mergeArrayBuffers(buffers) {\n        let totalLength = buffers.reduce((sum, b) => sum + b.byteLength, 0);\n        let temp = new Uint8Array(totalLength);\n        let offset = 0;\n        for (let buffer of buffers) {\n          temp.set(new Uint8Array(buffer), offset);\n          offset += buffer.byteLength;\n        }\n        return temp.buffer;\n      }\n\n      function showModal(html, onMount) {\n        const overlay = document.createElement(\"div\");\n        overlay.classList.add(\"modal-overlay\");\n        overlay.innerHTML = `<div class=\"modal-box\">${html}</div>`;\n        document.body.appendChild(overlay);\n        overlay.addEventListener(\"click\", (e) => {\n          if (e.target === overlay) overlay.remove();\n        });\n        if (onMount) onMount(overlay);\n        return overlay;\n      }\n\n      document.getElementById(\"feedback-btn\").addEventListener(\"click\", () => {\n        window.open(\n          \"https://docs.google.com/forms/d/e/1FAIpQLScq-wGpbkjwYh7L9sxC4JLg3wv8s_oSWHl4qgqaH_tRaV0Ymw/viewform?usp=publish-editor\",\n        );\n      });\n\n      function renderPlaylists() {\n        const container = document.getElementById(\"playlists-container\");\n        container.innerHTML = \"\";\n        playlists.forEach((pl, idx) => {\n          const item = document.createElement(\"div\");\n          item.classList.add(\"playlist-item\");\n          const coverEl = buildPlaylistCoverEl(pl, false);\n          const info = document.createElement(\"div\");\n          info.classList.add(\"playlist-info\");\n          const name = document.createElement(\"p\");\n          name.classList.add(\"playlist-name\");\n          name.textContent = pl.name;\n          const count = document.createElement(\"p\");\n          count.classList.add(\"playlist-count\");\n          count.textContent = `Playlist · ${pl.songs.length} song${pl.songs.length !== 1 ? \"s\" : \"\"}`;\n          info.appendChild(name);\n          info.appendChild(count);\n\n          const actions = document.createElement(\"div\");\n          actions.classList.add(\"playlist-actions\");\n\n          const renameBtn = document.createElement(\"button\");\n          renameBtn.classList.add(\"playlist-action-btn\");\n          renameBtn.title = \"Rename playlist\";\n          renameBtn.innerHTML = `<svg viewBox=\"0 0 24 24\"><path d=\"M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z\"/></svg>`;\n          renameBtn.addEventListener(\"click\", (e) => {\n            e.stopPropagation();\n            showRenamePlaylistModal(idx);\n          });\n\n          const deleteBtn = document.createElement(\"button\");\n          deleteBtn.classList.add(\"playlist-action-btn\");\n          deleteBtn.title = \"Delete playlist\";\n          deleteBtn.innerHTML = `<svg viewBox=\"0 0 24 24\"><path d=\"M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z\"/></svg>`;\n          deleteBtn.addEventListener(\"click\", (e) => {\n            e.stopPropagation();\n            showDeletePlaylistModal(idx);\n          });\n\n          actions.appendChild(renameBtn);\n          actions.appendChild(deleteBtn);\n\n          item.appendChild(coverEl);\n          item.appendChild(info);\n          item.appendChild(actions);\n          item.addEventListener(\"click\", () => openPlaylistUI(idx));\n          container.appendChild(item);\n        });\n      }\n\n      function showRenamePlaylistModal(idx) {\n        const pl = playlists[idx];\n        const overlay = showModal(\n          `\n          <h2>Rename playlist</h2>\n          <input class=\"modal-input\" id=\"rename-input\" placeholder=\"Playlist name\" maxlength=\"60\" value=\"${pl.name.replace(/\"/g, \"&quot;\")}\" />\n          <div class=\"modal-actions\">\n            <button class=\"modal-cancel\" id=\"rename-cancel\">Cancel</button>\n            <button class=\"modal-confirm\" id=\"rename-confirm\">Save</button>\n          </div>\n        `,\n          (o) => {\n            const input = o.querySelector(\"#rename-input\");\n            input.focus();\n            input.select();\n            o.querySelector(\"#rename-cancel\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelector(\"#rename-confirm\").addEventListener(\"click\", () => {\n              const n = input.value.trim();\n              if (!n) return;\n              playlists[idx].name = n;\n              savePlaylists();\n              renderPlaylists();\n              const titleDisplay = document.getElementById(\"pl-title-display\");\n              if (titleDisplay) titleDisplay.textContent = n;\n              o.remove();\n            });\n            input.addEventListener(\"keydown\", (e) => {\n              if (e.key === \"Enter\") o.querySelector(\"#rename-confirm\").click();\n            });\n          },\n        );\n      }\n\n      function showDeletePlaylistModal(idx) {\n        const pl = playlists[idx];\n        showModal(\n          `\n          <h2>Delete \"${pl.name}\"?</h2>\n          <p style=\"color:rgb(182,182,182);font-size:14px;margin:0;\">This will permanently delete the playlist. This cannot be undone.</p>\n          <div class=\"modal-actions\">\n            <button class=\"modal-cancel\" id=\"delete-cancel\">Cancel</button>\n            <button class=\"modal-confirm-danger\" id=\"delete-confirm\">Delete</button>\n          </div>\n        `,\n          (o) => {\n            o.querySelector(\"#delete-cancel\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelector(\"#delete-confirm\").addEventListener(\"click\", () => {\n              playlists.splice(idx, 1);\n              savePlaylists();\n              renderPlaylists();\n              const songsStuff = document.getElementById(\"songs-stuff\");\n              if (songsStuff && songsStuff.classList.contains(\"red-stuff\")) {\n                showHome();\n              }\n              o.remove();\n            });\n          },\n        );\n      }\n\n      function buildPlaylistCoverEl(pl, big) {\n        const size = big ? 232 : 48;\n        const covers = pl.songs.map((s) => s.cover).filter(Boolean);\n        const unique = [...new Set(covers)];\n        if (unique.length === 0) {\n          const wrap = document.createElement(\"div\");\n          wrap.classList.add(big ? \"playlist-big-cover\" : \"playlist-cover\");\n          wrap.style.width = size + \"px\";\n          wrap.style.height = size + \"px\";\n          wrap.innerHTML = big\n            ? `<svg class=\"playlist-empty-icon-big\" viewBox=\"0 0 24 24\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`\n            : `<svg class=\"playlist-cover-empty-icon\" viewBox=\"0 0 24 24\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`;\n          return wrap;\n        }\n        if (unique.length < 4 || !big) {\n          const wrap = document.createElement(\"div\");\n          wrap.classList.add(\"playlist-cover\");\n          wrap.style.width = size + \"px\";\n          wrap.style.height = size + \"px\";\n          const img = document.createElement(\"img\");\n          img.src = unique[0];\n          img.style.cssText =\n            \"width:100%;height:100%;object-fit:cover;border-radius:4px;\";\n          wrap.appendChild(img);\n          return wrap;\n        }\n        const grid = document.createElement(\"div\");\n        grid.classList.add(\n          big ? \"playlist-big-cover-grid\" : \"playlist-cover-grid\",\n        );\n        unique.slice(0, 4).forEach((src) => {\n          const img = document.createElement(\"img\");\n          img.src = src;\n          grid.appendChild(img);\n        });\n        return grid;\n      }\n\n      document.getElementById(\"create-btn\").addEventListener(\"click\", () => {\n        const overlay = showModal(\n          `\n          <h2>Name your playlist</h2>\n          <input class=\"modal-input\" id=\"playlist-name-input\" placeholder=\"My playlist\" maxlength=\"60\" />\n          <div class=\"modal-actions\">\n            <button class=\"modal-cancel\" id=\"modal-cancel-btn\">Cancel</button>\n            <button class=\"modal-confirm\" id=\"modal-confirm-btn\">Create</button>\n          </div>\n        `,\n          (o) => {\n            const input = o.querySelector(\"#playlist-name-input\");\n            input.focus();\n            o.querySelector(\"#modal-cancel-btn\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelector(\"#modal-confirm-btn\").addEventListener(\n              \"click\",\n              () => {\n                const n = input.value.trim();\n                if (!n) return;\n                playlists.push({ name: n, songs: [] });\n                savePlaylists();\n                renderPlaylists();\n                o.remove();\n              },\n            );\n            input.addEventListener(\"keydown\", (e) => {\n              if (e.key === \"Enter\")\n                o.querySelector(\"#modal-confirm-btn\").click();\n            });\n          },\n        );\n      });\n\n      function openPlaylistUI(idx) {\n        const pl = playlists[idx];\n        allSongsRN = pl.songs;\n        const songsStuff = document.querySelector(\".songs-stuff\");\n        songsStuff.classList.add(\"red-stuff\");\n        songsStuff.scrollTop = 0;\n        const coverEl = buildPlaylistCoverEl(pl, true);\n        coverEl.id = \"playlist-big-cover-el\";\n        songsStuff.innerHTML = \"\";\n        const topInfo = document.createElement(\"div\");\n        topInfo.classList.add(\"top-player-info\");\n        const actualInfo = document.createElement(\"div\");\n        actualInfo.classList.add(\"top-actual-info\");\n        actualInfo.innerHTML = `\n          <h1 class=\"huge-title\" id=\"pl-title-display\">${pl.name}</h1>\n          <p class=\"artist-clicky\">Playlist · ${pl.songs.length} song${pl.songs.length !== 1 ? \"s\" : \"\"}</p>\n        `;\n        topInfo.appendChild(coverEl);\n        topInfo.appendChild(actualInfo);\n        songsStuff.appendChild(topInfo);\n        const playOptions = document.createElement(\"div\");\n        playOptions.classList.add(\"play-options\");\n        playOptions.innerHTML = `\n          <button class=\"big-play\" id=\"pl-big-play\">\n            <svg data-encore-id=\"icon\" role=\"img\" aria-hidden=\"true\" class=\"play-icon-but-cool\" viewBox=\"0 0 16 16\">\n              <path d=\"M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288z\"></path>\n            </svg>\n          </button>\n        `;\n        songsStuff.appendChild(playOptions);\n        const songsInAlbumWrap = document.createElement(\"div\");\n        songsInAlbumWrap.classList.add(\"songs-in-album\");\n        songsInAlbumWrap.innerHTML = `<div class=\"album-header\"><p class=\"hash\">#</p><p class=\"title-sayer\">Title</p></div>`;\n        const songsPlace = document.createElement(\"div\");\n        songsPlace.classList.add(\"songs-place2\");\n        songsPlace.id = \"pl-songs-place\";\n        songsInAlbumWrap.appendChild(songsPlace);\n        songsStuff.appendChild(songsInAlbumWrap);\n        document\n          .getElementById(\"pl-big-play\")\n          .addEventListener(\"click\", async () => {\n            if (pl.songs.length > 0) await playAnySong(pl.songs[0]);\n          });\n        renderPlaylistSongs(idx);\n      }\n\n      function renderPlaylistSongs(idx) {\n        const pl = playlists[idx];\n        const songsPlace = document.getElementById(\"pl-songs-place\");\n        if (!songsPlace) return;\n        songsPlace.innerHTML = \"\";\n        allSongsRN = pl.songs;\n        if (pl.songs.length === 0) {\n          const empty = document.createElement(\"p\");\n          empty.style.cssText = \"opacity:0.5;margin:20px 0;font-size:14px;\";\n          empty.textContent =\n            \"No songs yet. Add some using the + button on any song.\";\n          songsPlace.appendChild(empty);\n          return;\n        }\n        pl.songs.forEach((ssong, si) => {\n          const singleSong = document.createElement(\"div\");\n          singleSong.classList.add(\"song56\");\n          singleSong.innerHTML = `\n            <div class=\"song56-left\">\n              <p class=\"song-number\">${si + 1}</p>\n              <p class=\"song-title-small\">${ssong.title}</p>\n            </div>\n            <div class=\"songs56-right\">\n              <button class=\"add-to-album\" title=\"Remove from playlist\" data-remove=\"${si}\">\n                <svg viewBox=\"0 0 24 24\" style=\"fill:rgb(136,136,136);width:20px;height:20px;\"><path d=\"M19 13H5v-2h14v2z\"/></svg>\n              </button>\n            </div>\n          `;\n          singleSong.addEventListener(\"click\", async (e) => {\n            if (e.target.closest(\"[data-remove]\")) {\n              const removeIdx = parseInt(\n                e.target.closest(\"[data-remove]\").dataset.remove,\n              );\n              pl.songs.splice(removeIdx, 1);\n              savePlaylists();\n              renderPlaylists();\n              renderPlaylistSongs(idx);\n              return;\n            }\n            await playAnySong(ssong);\n          });\n          songsPlace.appendChild(singleSong);\n        });\n      }\n\n      function showAddToPlaylistModal(song) {\n        if (playlists.length === 0) {\n          showModal(\n            `\n            <h2>No playlists yet</h2>\n            <p style=\"color:rgb(182,182,182);font-size:14px;margin:0;\">Create a playlist first using the Create button.</p>\n            <div class=\"modal-actions\"><button class=\"modal-confirm\" id=\"modal-ok-btn\">Got it</button></div>\n          `,\n            (o) => {\n              o.querySelector(\"#modal-ok-btn\").addEventListener(\"click\", () =>\n                o.remove(),\n              );\n            },\n          );\n          return;\n        }\n        const listHTML = playlists\n          .map((pl, i) => {\n            const alreadyAdded = pl.songs.some((s) => s.id === song.id);\n            return `\n            <div class=\"add-song-modal-item${alreadyAdded ? \" already-added\" : \"\"}\" data-pl-idx=\"${i}\">\n              <div style=\"width:40px;height:40px;border-radius:4px;background:#2c2c2c;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;\">\n                ${pl.songs[0] ? `<img src=\"${pl.songs[0].cover || \"\"}\" style=\"width:100%;height:100%;object-fit:cover;\" />` : `<svg viewBox=\"0 0 24 24\" style=\"fill:#888;width:18px;height:18px;\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`}\n              </div>\n              <div class=\"add-song-modal-item-info\">\n                <span class=\"add-song-modal-item-title\">${pl.name}</span>\n                <span class=\"add-song-modal-item-artist\">${pl.songs.length} song${pl.songs.length !== 1 ? \"s\" : \"\"}${alreadyAdded ? \" · Already added\" : \"\"}</span>\n              </div>\n            </div>\n          `;\n          })\n          .join(\"\");\n        showModal(\n          `\n          <h2>Add to playlist</h2>\n          <div class=\"add-song-modal-list\">${listHTML}</div>\n          <div class=\"modal-actions\"><button class=\"modal-cancel\" id=\"modal-cancel-btn\">Cancel</button></div>\n        `,\n          (o) => {\n            o.querySelector(\"#modal-cancel-btn\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelectorAll(\n              \".add-song-modal-item:not(.already-added)\",\n            ).forEach((el) => {\n              el.addEventListener(\"click\", () => {\n                const plIdx = parseInt(el.dataset.plIdx);\n                playlists[plIdx].songs.push(song);\n                savePlaylists();\n                renderPlaylists();\n                o.remove();\n              });\n            });\n          },\n        );\n      }\n\n      async function playAnySong(song) {\n        if (song.uploadedBlob) {\n          const audio = new Audio(song.uploadedBlob);\n          songUI(audio, song);\n        } else {\n          await fetchMP3(song);\n        }\n      }\n\n      async function fetchMetaStuff() {\n        const res = await fetch(\n          \"https://cdn.jsdelivr.net/gh/DSMOnVR/shittifylol@master/meta.json\",\n          { cache: \"no-store\" },\n        );\n\n        if (!res.ok) {\n          console.error(\"couldn't get meta.json\");\n          return null;\n        }\n\n        return await res.json();\n      }\n\n      async function loadUploaded() {\n        const rows = await dbGetAll();\n        allUploaded = rows;\n        renderUploadedCards();\n      }\n\n      function renderUploadedCards() {\n        const container = document.getElementById(\"cards-uploaded\");\n        if (!container) return;\n        container.innerHTML = \"\";\n        allUploaded.forEach((song) => {\n          container.appendChild(makeUploadedCard(song));\n        });\n        const wrapper = container.closest(\".cards-wrapper\");\n        if (wrapper) {\n          setTimeout(() => updateArrowStates(container), 50);\n        }\n      }\n\n      function makeUploadedCard(song) {\n        const card = document.createElement(\"div\");\n        card.classList.add(\"card\");\n        const img = document.createElement(\"div\");\n        img.style.cssText =\n          \"width:151.5px;height:151.5px;border-radius:5px;background:#2c2c2c;display:flex;align-items:center;justify-content:center;\";\n        img.innerHTML = `<svg viewBox=\"0 0 24 24\" style=\"fill:#888;width:48px;height:48px;\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`;\n        const name = document.createElement(\"p\");\n        name.textContent = song.title;\n        name.classList.add(\"song-name\");\n        const artistName = document.createElement(\"p\");\n        artistName.textContent = \"You\";\n        artistName.classList.add(\"artist-name\");\n        card.appendChild(img);\n        card.appendChild(name);\n        card.appendChild(artistName);\n        card.addEventListener(\"click\", () => {\n          allSongsRN = allUploaded;\n          playAnySong(song);\n        });\n        return card;\n      }\n\n      document.getElementById(\"upload-btn\").addEventListener(\"click\", () => {\n        alert(\"these uploaded songs ONLY appear for u\");\n        document.getElementById(\"file-input\").click();\n      });\n\n      document\n        .getElementById(\"file-input\")\n        .addEventListener(\"change\", async (e) => {\n          const files = Array.from(e.target.files);\n          for (const file of files) {\n            const reader = new FileReader();\n            reader.onload = async (ev) => {\n              const blobUrl = URL.createObjectURL(file);\n              const id =\n                \"upload-\" +\n                Date.now() +\n                \"-\" +\n                Math.random().toString(36).slice(2);\n              const song = {\n                id,\n                title: file.name.replace(/\\.mp3$/i, \"\"),\n                artist: \"You\",\n                cover: null,\n                uploadedBlob: blobUrl,\n                uploadedData: ev.target.result,\n                parts: 1,\n                album: \"single\",\n              };\n              await dbPut(song);\n              allUploaded.push(song);\n              renderUploadedCards();\n            };\n            reader.readAsArrayBuffer(file);\n          }\n          e.target.value = \"\";\n        });\n\n      function makeCard(song, onClick) {\n        const card = document.createElement(\"div\");\n        card.classList.add(\"card\");\n        const img = document.createElement(\"img\");\n        card.setAttribute(\"title\", song.name || song.title);\n        img.src = song.cover || \"\";\n        img.classList.add(\"title\");\n        const name = document.createElement(\"p\");\n        name.textContent = song.name || song.title;\n        name.classList.add(\"song-name\");\n        const artistName = document.createElement(\"p\");\n        artistName.textContent = song.artist || \"\";\n        artistName.classList.add(\"artist-name\");\n        card.appendChild(img);\n        card.appendChild(name);\n        card.appendChild(artistName);\n        card.addEventListener(\"click\", onClick);\n        return card;\n      }\n\n      function makeArtistCard(profile, onClick) {\n        const card = document.createElement(\"div\");\n        card.classList.add(\"card\");\n        const artistPfp = document.createElement(\"img\");\n        artistPfp.classList.add(\"artist\");\n        artistPfp.src = profile.image;\n        const artistName = document.createElement(\"p\");\n        artistName.classList.add(\"song-name\");\n        artistName.textContent = profile.name;\n        card.appendChild(artistPfp);\n        card.appendChild(artistName);\n        card.addEventListener(\"click\", onClick);\n        return card;\n      }\n\n      function showHome() {\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.outerHTML = `\n          <div class=\"songs-stuff\" id=\"songs-stuff\">\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">New Additions</h1><p class=\"show-all-btn\" data-cat=\"new\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-new\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-new\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-new\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">All Artists</h1><p class=\"show-all-btn\" data-cat=\"artists\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-artists\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-artists\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-artists\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">All Albums & Singles</h1><p class=\"show-all-btn\" data-cat=\"albums\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-albums\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-albums\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-albums\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">User Uploaded</h1><p class=\"show-all-btn\" data-cat=\"uploaded\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-uploaded\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-uploaded\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-uploaded\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n          </div>\n        `;\n        setupArrowButtons();\n        populateHomeSections();\n        renderUploadedCards();\n        attachShowAllListeners();\n      }\n\n      function resolveAlbumCover(songOrAlbum) {\n        if (songOrAlbum.cover) return songOrAlbum.cover;\n        const albumName = songOrAlbum.album || songOrAlbum.name;\n        if (albumName && albumName !== \"single\") {\n          const found = metaJson.albums.find((a) => a.name === albumName);\n          if (found && found.cover) return found.cover;\n        }\n        return \"\";\n      }\n\n      function populateHomeSections() {\n        const WEEK_MS = 7 * 24 * 60 * 60 * 1000;\n\n        // FIX 1: build the full unsliced new-additions list first, then slice 12 for the home row\n        allNewSongsFull = Array.from(\n          new Map(\n            metaJson.songs\n              .filter((song) => {\n                const diff = Date.now() - new Date(song.dateAdded).getTime();\n                return diff >= 0 && diff <= WEEK_MS;\n              })\n              .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))\n              .map((song) => {\n                const displayName =\n                  song.album === \"single\" ? song.title : song.album;\n                const cover = resolveAlbumCover(song);\n                return [\n                  displayName,\n                  {\n                    id: song.id,\n                    name: displayName,\n                    cover,\n                    artist: song.artist,\n                    album: song.album,\n                    parts: song.parts,\n                    title: song.title,\n                  },\n                ];\n              }),\n          ).values(),\n        );\n        allNewSongs = allNewSongsFull.slice(0, 12);\n\n        allArtists = shuffle(metaJson.profiles);\n\n        // FIX 2: build the full shuffled albums list, then slice 12 for the home row\n        allAlbumsFull = shuffle(\n          Array.from(\n            new Map([\n              ...metaJson.songs.map((song) => {\n                const displayName =\n                  song.album === \"single\" ? song.title : song.album;\n                const cover = resolveAlbumCover(song);\n                return [\n                  displayName,\n                  {\n                    id: song.id,\n                    title: song.title,\n                    name: displayName,\n                    album: song.album,\n                    artist: song.artist,\n                    cover,\n                    parts: song.parts,\n                    dateAdded: song.dateAdded,\n                    isAlbum: false,\n                  },\n                ];\n              }),\n              ...metaJson.albums.map((album) => [\n                album.name,\n                {\n                  id: album.id,\n                  title: album.name,\n                  name: album.name,\n                  album: album.name,\n                  artist: album.artist || null,\n                  cover: album.cover,\n                  parts: album.parts || [],\n                  dateAdded: album.dateAdded || null,\n                  isAlbum: true,\n                },\n              ]),\n            ]).values(),\n          ),\n        );\n        allAlbums = allAlbumsFull.slice(0, 12);\n\n        const newContainer = document.getElementById(\"cards-new\");\n        const artistsContainer = document.getElementById(\"cards-artists\");\n        const albumsContainer = document.getElementById(\"cards-albums\");\n\n        allNewSongs.forEach((song) => {\n          newContainer.appendChild(makeCard(song, () => openSong(song)));\n        });\n\n        allArtists.forEach((profile) => {\n          artistsContainer.appendChild(\n            makeArtistCard(profile, () => openArtistPage(profile)),\n          );\n        });\n\n        allAlbums.forEach((song) => {\n          albumsContainer.appendChild(makeCard(song, () => openSong(song)));\n        });\n\n        setTimeout(() => {\n          document\n            .querySelectorAll(\".cards\")\n            .forEach((c) => updateArrowStates(c));\n        }, 100);\n      }\n\n      function attachShowAllListeners() {\n        document.querySelectorAll(\".show-all-btn\").forEach((btn) => {\n          btn.addEventListener(\"click\", () => {\n            const cat = btn.dataset.cat;\n            openShowAll(cat);\n          });\n        });\n      }\n\n      function openShowAll(cat) {\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.className = \"songs-stuff\";\n        songsStuff.scrollTop = 0;\n        songsStuff.innerHTML = \"\";\n\n        const backBtn = document.createElement(\"button\");\n        backBtn.style.cssText =\n          \"background:transparent;border:none;color:white;font-family:'Spotify Mix';font-size:14px;cursor:pointer;opacity:0.7;margin-bottom:10px;padding:0;\";\n        backBtn.textContent = \"← Back\";\n        backBtn.addEventListener(\"click\", showHome);\n        songsStuff.appendChild(backBtn);\n\n        const title = document.createElement(\"h1\");\n        title.style.cssText = \"font-size:2rem;margin-bottom:20px;\";\n\n        const grid = document.createElement(\"div\");\n        grid.classList.add(\"show-all-grid\");\n\n        if (cat === \"new\") {\n          title.textContent = \"New Additions\";\n          songsStuff.appendChild(title);\n          // FIX 1: use allNewSongsFull so all new songs are shown, not just 12\n          allNewSongsFull.forEach((song) =>\n            grid.appendChild(makeCard(song, () => openSong(song))),\n          );\n        } else if (cat === \"artists\") {\n          title.textContent = \"All Artists\";\n          songsStuff.appendChild(title);\n          allArtists.forEach((profile) =>\n            grid.appendChild(\n              makeArtistCard(profile, () => openArtistPage(profile)),\n            ),\n          );\n        } else if (cat === \"albums\") {\n          title.textContent = \"All Albums & Singles\";\n          songsStuff.appendChild(title);\n          // FIX 2: use allAlbumsFull (already shuffled) instead of rebuilding unshuffled\n          allAlbumsFull.forEach((song) =>\n            grid.appendChild(makeCard(song, () => openSong(song))),\n          );\n        } else if (cat === \"uploaded\") {\n          title.textContent = \"User Uploaded\";\n          songsStuff.appendChild(title);\n          allUploaded.forEach((song) => {\n            const card = makeUploadedCard(song);\n            grid.appendChild(card);\n          });\n        }\n\n        songsStuff.appendChild(grid);\n      }\n\n      function openArtistPage(profile) {\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.className = \"songs-stuff red-stuff\";\n        songsStuff.scrollTop = 0;\n        songsStuff.innerHTML = \"\";\n\n        const backBtn = document.createElement(\"button\");\n        backBtn.style.cssText =\n          \"background:transparent;border:none;color:white;font-family:'Spotify Mix';font-size:14px;cursor:pointer;opacity:0.7;margin-bottom:10px;padding:0;\";\n        backBtn.textContent = \"← Back\";\n        backBtn.addEventListener(\"click\", showHome);\n        songsStuff.appendChild(backBtn);\n\n        const header = document.createElement(\"div\");\n        header.classList.add(\"artist-page-header\");\n\n        const img = document.createElement(\"img\");\n        img.src = profile.image;\n        img.classList.add(\"artist-page-img\");\n\n        const nameEl = document.createElement(\"h1\");\n        nameEl.classList.add(\"artist-page-name\");\n        nameEl.textContent = profile.name;\n\n        header.appendChild(img);\n        header.appendChild(nameEl);\n        songsStuff.appendChild(header);\n\n        const artistSongs = metaJson.songs.filter(\n          (s) => s.artist === profile.name,\n        );\n        const artistAlbums = metaJson.albums.filter(\n          (a) => a.artist === profile.name,\n // ---- games (encrypted) ----
// Files in games/ are AES-GCM encrypted with your code, so nobody can read the game source on GitHub without it.
// Make them with encrypt.html, then upload the .enc files and index.json to the games/ folder.
const KDF=1000;
// Games open with no code. This key is baked in (encrypt.html has the same one). If you change it, re-encrypt your games.
const GAMES_KEY='3d55bf4b0663c90ef947553c929df7be';
const gcode=GAMES_KEY;
const gp=n=>n.includes('/')?n:'games/'+n,isEnc=f=>/\.enc$/i.test(f);
async function gdec(code,buf){const u=new Uint8Array(buf),k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u.slice(0,16),iterations:KDF,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},key,u.slice(28))))}
async function glist(){const r=await fetch('games/index.json',{cache:'no-cache'});return r.ok?await r.json():[]}
function gamesApp(b){
 b.innerHTML='<div class="gm"><div class="gg"><div class="gs"><input type="search" placeholder="Search games" aria-label="Search games"></div><div class="gr">Loading…</div></div></div>';

 const GP='<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC.games[2]+'</svg>';
 async function loadAll(){const src=(await glist().catch(()=>[])).map(f=>({f:gp(f)}));
  tabs=await Promise.all(src.map(async s=>{const nm=s.f.split('/').pop();try{if(isEnc(s.f)){const r=await fetch(s.f);if(!r.ok)throw 0;const o=await gdec(gcode,await r.arrayBuffer());return {...s,n:o.n||nm,h:o.h,t:o.t}}return {...s,n:nm}}catch(e){return {...s,n:nm,bad:1}}}));
  tabs.sort((x,y)=>x.n.localeCompare(y.n))}
 function playGame(t){openApp('games',{id:'games',fs:true,n:t.n,icon:'games',w:860,h:600,r:body=>{const fr=document.createElement('iframe');fr.title=t.n;fr.allow='fullscreen; autoplay; gamepad; pointer-lock';fr.setAttribute('allowfullscreen','');fr.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff';if(t.h!=null)fr.srcdoc=t.h;else fr.src=t.f;body.append(fr)}})}

  if(!list.length){gr.append(mk(tabs.length?'No games match your search.':'No games yet. Encrypt them with encrypt.html, upload them to the games folder, and list them in games/index.json.','p','gn'));return}
  list.forEach(t=>{const ok=t.t&&!t.bad,el=mk(null,'button','tile'+(ok?'':' ph')+(t.bad?' bad':''));el.title=t.bad?'Could not load this game. Check the path and the code.':t.n;
   if(ok){const im=document.createElement('img');im.alt='';im.src=t.t;el.append(im)}else el.insertAdjacentHTML('beforeend',GP);
   el.append(mk(esc(t.n),'span'));el.onclick=()=>{if(!t.bad)playGame(t)};gr.append(el)})}
 q.oninput=renderGrid;loadAll().then(renderGrid)}
