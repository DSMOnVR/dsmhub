<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSMHub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--panel:#17181c;--panel2:#202228;--line:#2c2e35;--text:#f1f2f4;--dim:#9a9ca6;--accent:#87cf3e;--wall:radial-gradient(ellipse at 55% 45%,#2a2b31 0%,#141518 55%,#08080a 100%);box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 Poppins,system-ui,sans-serif;user-select:none}
#desk{position:fixed;inset:0 0 48px 0;background:var(--wall);background-size:cover}
#logo{position:absolute;left:50%;top:46%;width:240px;height:240px;transform:translate(-50%,-50%) rotate(-18deg);border-radius:50%;border:16px solid #d8d9dd;box-shadow:0 20px 60px #000a,inset 0 0 20px #0008;opacity:.9;display:grid;place-items:center;pointer-events:none}
#logo b{font-size:96px;color:#d8d9dd;letter-spacing:-6px}
#icons{position:absolute;left:8px;top:8px;bottom:8px;display:grid;grid-template-columns:repeat(2,84px);grid-auto-rows:92px;grid-auto-flow:row;align-content:start;gap:0}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:6px;cursor:default;text-align:center;font-size:11.5px;text-shadow:0 1px 3px #000}
.ic:hover{background:#ffffff14}.ic.sel{background:#87cf3e30;outline:1px solid #87cf3e66}
.g{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:24px;box-shadow:0 2px 6px #0007}
.win{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 44px #000b;display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:160px}
.win.max{inset:0 0 0 0!important;width:auto!important;height:auto!important;border-radius:0}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:36px;background:var(--panel2);cursor:grab;flex:none}
.tb span{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb button{width:28px;height:24px;border:0;border-radius:5px;background:none;color:var(--dim);font-size:14px;cursor:pointer}
.tb button:hover{background:#ffffff1c;color:var(--text)}.tb .x:hover{background:#e5484d;color:#fff}
.body{flex:1;overflow:auto;position:relative;min-height:0}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
#bar{position:fixed;left:0;right:0;bottom:0;height:48px;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:2px;padding-left:6px;padding-right:6px;z-index:9999}
.tbtn{height:40px;min-width:40px;padding:0 8px;border:0;border-radius:7px;background:none;color:var(--text);display:flex;align-items:center;gap:7px;cursor:pointer;font:inherit;position:relative}
.tbtn:hover{background:#ffffff14}
.tbtn.on::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:3px;border-radius:2px;background:var(--accent)}
.tbtn.act{background:#ffffff1a}
.tbtn .g{width:28px;height:28px;font-size:17px;border-radius:7px;box-shadow:none}
#tasks{display:flex;gap:2px;flex:1;overflow:hidden}
#tasks .tbtn{max-width:170px}#tasks .tbtn em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
#tray{display:flex;align-items:center;gap:12px;color:var(--dim);padding-right:2px}
#clk{text-align:right;line-height:1.15;color:var(--text);font-size:12.5px}#clk small{display:block;color:var(--dim);font-size:10.5px}
#sd{width:16px;height:22px;border:1.5px solid var(--dim);border-radius:3px;background:none;cursor:pointer}
#sd:hover{border-color:var(--text)}
#menu{position:fixed;left:6px;bottom:54px;width:340px;max-height:70vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px #000b;display:none;flex-direction:column;z-index:9998;overflow:hidden}
#menu.open{display:flex}
#menu input{margin:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;outline:none;user-select:text}
#menu input:focus{border-color:var(--accent)}
#list{overflow:auto;padding:0 6px 8px}
#list .tbtn{width:100%;height:44px}
.pad{padding:14px}
textarea.np{width:100%;height:100%;border:0;resize:none;background:#111215;color:var(--text);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;outline:none;user-select:text}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;height:100%;grid-auto-rows:1fr}
.calc .scr{grid-column:1/-1;background:#0e0f12;border-radius:8px;padding:8px 12px;text-align:right;font-size:26px;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden;min-height:54px}
.calc button{border:0;border-radius:8px;background:var(--panel2);color:var(--text);font:500 16px Poppins,sans-serif;cursor:pointer}
.calc button:hover{background:#2b2e36}.calc .op{background:#2c3a1c;color:var(--accent)}.calc .eq{background:var(--accent);color:#10150a}
.urlbar{display:flex;gap:6px;padding:8px;background:var(--panel2)}
.urlbar input{flex:1;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none;user-select:text}
.urlbar button,.btn{padding:7px 14px;border:0;border-radius:8px;background:var(--accent);color:#10150a;font:500 13px Poppins,sans-serif;cursor:pointer}
iframe{width:100%;height:calc(100% - 50px);border:0;background:#fff}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:12px}
.fl .ic{padding:10px 2px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sw div{width:84px;height:54px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.sw div:hover{border-color:var(--accent)}

#lock{position:fixed;inset:0;z-index:20000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background:#0c0a12;transition:opacity .5s,transform .6s cubic-bezier(.6,0,.3,1)}
#lock::before{content:"";position:absolute;inset:-40px;filter:blur(14px) saturate(1.1);background-image:var(--wallimg),var(--garden);background-size:cover;background-position:center}
#lock::after{content:"";position:absolute;inset:0;background:#0006}
#lock>*{position:relative;z-index:1}
#lock.gone{opacity:0;transform:translateY(-24px);pointer-events:none}
#lt{font:46px 'Press Start 2P',monospace;color:#fff;letter-spacing:4px;text-shadow:0 3px 0 #0008,0 0 24px #0009}
#ld{font:30px VT323,monospace;color:#f3eef4;letter-spacing:3px;margin-top:22px;text-shadow:0 2px 6px #000a}
#lc{font:22px VT323,monospace;color:#fff;letter-spacing:2px;margin-top:38px;text-shadow:0 2px 6px #000a}
#lh{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font:20px VT323,monospace;color:#ffffffa0;letter-spacing:2px;animation:bl 2.4s ease-in-out infinite}
@keyframes bl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#lh{animation:none}#lock{transition:opacity .2s}}
@media (max-width:560px){#lt{font-size:26px}#ld{font-size:24px}}
#lockbtn{margin:0 10px 10px;height:40px;justify-content:center;background:var(--panel2)}
:root{--wallimg:none;--garden:radial-gradient(ellipse 22% 30% at 12% 62%,#6aa646aa,transparent),radial-gradient(ellipse 20% 26% at 30% 70%,#e88fb0aa,transparent),radial-gradient(ellipse 26% 30% at 62% 78%,#4f8a3eaa,transparent),radial-gradient(ellipse 18% 24% at 82% 64%,#ee9ab8aa,transparent),radial-gradient(ellipse 30% 22% at 50% 14%,#8a3a5caa,transparent),radial-gradient(ellipse 34% 28% at 50% 42%,#b9a3b8aa,transparent),radial-gradient(ellipse 14% 90% at 4% 40%,#0b0b1a,transparent),radial-gradient(ellipse 14% 90% at 96% 40%,#0b0b1a,transparent)}
#desk{overflow:hidden}
#desk::before,#desk::after{content:"";position:absolute;inset:-40px;display:none;z-index:0;pointer-events:none}
#desk::before{filter:blur(14px) saturate(1.1);background-image:var(--wallimg),var(--garden);background-size:cover;background-position:center}
#desk::after{inset:0;background:#0006}
#desk.garden::before,#desk.garden::after{display:block}
#icons{z-index:1}
.g{box-shadow:0 2px 6px #0007,inset 0 1px 0 #ffffff48}
.g svg{width:56%;height:56%}
.g.sm{width:20px;height:20px;border-radius:5px;box-shadow:none}
.ti{width:18px;height:18px}
img.g,.tbtn img.g{border-radius:23%;display:block;object-fit:contain;box-shadow:0 2px 6px #0006}
.tbtn img.g,#tasks img.g{box-shadow:none}
.set h4{margin:16px 0 8px;font-weight:600}.set h4:first-child{margin-top:0}
.set .row{display:flex;gap:8px;margin-bottom:8px;align-items:center;justify-content:space-between}
.set input{flex:1;min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none;user-select:text}
.set input:focus{border-color:var(--accent)}
.btn.alt{background:var(--panel2);color:var(--text)}
[data-theme=light]{--bg:#eef0f4;--panel:#f7f8fa;--panel2:#e8ebf0;--line:#d5d9e0;--text:#1c1e24;--dim:#5d6270}
[data-theme=light] .tbtn:hover,[data-theme=light] .tb button:hover{background:#00000012}
[data-theme=light] .tbtn.act{background:#0000001a}
[data-theme=light] textarea.np,[data-theme=light] #menu input,[data-theme=light] .urlbar input,[data-theme=light] .set input{background:#fff}
[data-theme=light] .calc .scr{background:#e4e7ec}
[data-theme=light] .calc button:hover{background:#d9dde4}
[data-theme=light] .calc .op{background:#e0f0cd;color:#3b7d12}
.gm{position:absolute;inset:0;display:flex;flex-direction:column}
.gt{display:flex;gap:4px;padding:6px 8px 0;background:var(--panel2);overflow-x:auto;flex:none}
.gt .sp{flex:1}
.gtab{border:0;padding:8px 14px;border-radius:8px 8px 0 0;background:none;color:var(--dim);font:500 12.5px Poppins,sans-serif;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.gtab:hover{background:#ffffff10;color:var(--text)}.gtab.on{background:var(--panel);color:var(--text)}
.gc{opacity:.55}.gc:hover{opacity:1}
.gx{gap:8px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.gv{flex:1;min-height:0;position:relative;background:var(--bg)}
.gv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.ge{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);padding:20px;text-align:center}
.gl{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.gl h3{font-size:18px}.gl p{color:var(--dim)}.gl .row{display:flex;gap:8px}.gl .er{color:#f87171;min-height:1.3em}
.gl input,.gx input{flex:1;min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none;user-select:text}
.gl input:focus,.gx input:focus{border-color:var(--accent)}
[data-theme=light] .gtab:hover{background:#0000000d}
[data-theme=light] .gl input,[data-theme=light] .gx input{background:#fff}
.gg{position:absolute;inset:0;overflow:auto;padding:0 14px 14px;background:var(--bg)}
.gs{position:sticky;top:0;padding:12px 0;background:var(--bg);z-index:2}
.gs input{width:100%;max-width:380px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none;user-select:text}
.gs input:focus{border-color:var(--accent)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.gn{grid-column:1/-1;color:var(--dim);padding:24px 0;text-align:center}
.tile{aspect-ratio:1;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--panel);color:var(--dim);cursor:pointer;position:relative;display:block;transition:transform .12s,box-shadow .12s}
.tile:hover,.tile:focus-visible{transform:scale(1.05);box-shadow:0 8px 22px #0008;outline:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile>span:not(.rm){position:absolute;left:0;right:0;bottom:0;padding:22px 6px 7px;font:500 11px Poppins,sans-serif;color:#fff;background:linear-gradient(transparent,#000d);text-align:center;opacity:0;transition:opacity .12s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:hover>span:not(.rm),.tile:focus-visible>span:not(.rm){opacity:1}
.tile.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line)}
.tile.ph>span:not(.rm){position:static;padding:0 8px;background:none;opacity:1;color:var(--dim);max-width:100%}
.tile.bad{opacity:.45;cursor:not-allowed}
.rm{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;font-size:10px;display:none;place-items:center}
.tile:hover .rm{display:grid}
.win:fullscreen{border:0;border-radius:0;box-shadow:none}
.win:fullscreen .tb,.win:fullscreen .rs{display:none}
.win:-webkit-full-screen{border:0;border-radius:0;box-shadow:none}
.win:-webkit-full-screen .tb,.win:-webkit-full-screen .rs{display:none}

/* DSMHub Discord-style community chat */
.dch{height:100%;min-height:0;display:grid;grid-template-columns:62px 208px minmax(0,1fr) 190px;background:#313338;color:#f2f3f5;font:13px/1.45 Poppins,system-ui,sans-serif;overflow:hidden}
.dch button,.dch input,.dch textarea{font:inherit}
.dch-rail{background:#1e1f22;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 7px}
.dch-logo,.dch-server{width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;background:#313338;color:#fff;font-weight:700;cursor:pointer;transition:.14s}
.dch-logo{background:#5865f2;border-radius:15px;font-size:15px}
.dch-server:hover,.dch-server.active{border-radius:15px;background:#5865f2}
.dch-divider{width:30px;height:1px;background:#3f4147}
.dch-channels{background:#2b2d31;display:flex;flex-direction:column;min-width:0}
.dch-head{height:49px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #202124;font-weight:600;color:#fff}
.dch-head .dch-gear{border:0;background:none;color:#b5bac1;font-size:16px;cursor:pointer}
.dch-channel-title{padding:19px 10px 6px;color:#949ba4;font-size:10px;font-weight:700;letter-spacing:.08em}
.dch-channel-list{padding:0 7px}
.dch-channel{width:100%;height:34px;padding:0 9px;border:0;border-radius:5px;background:none;color:#b5bac1;text-align:left;display:flex;align-items:center;gap:8px;cursor:pointer}
.dch-channel:hover{background:#35373c;color:#dbdee1}
.dch-channel.active{background:#404249;color:#fff}
.dch-hash{font-size:18px;color:#949ba4}
.dch-server-info{margin-top:auto;padding:11px 12px;background:#232428;color:#b5bac1;font-size:11px}
.dch-server-info strong{display:block;color:#fff;font-size:12px}
.dch-main{min-width:0;min-height:0;display:flex;flex-direction:column;background:#313338}
.dch-top{height:49px;flex:none;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid #25262a;box-shadow:0 1px 2px #0003}
.dch-top .dch-hash{font-size:23px}
.dch-top strong{font-size:14px;color:#fff}
.dch-topic{color:#b5bac1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dch-top-spacer{flex:1}
.dch-connection{font-size:11px;color:#949ba4}
.dch-user{max-width:142px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dbdee1;font-size:11px}
.dch-small-btn{height:29px;padding:0 9px;border:0;border-radius:5px;background:#404249;color:#e3e5e8;cursor:pointer;font-size:11px}
.dch-small-btn:hover{background:#4d5058}
.dch-messages{flex:1;min-height:0;overflow:auto;padding:18px 18px 12px;user-select:text}
.dch-welcome{padding:8px 0 20px;border-bottom:1px solid #41434a;margin-bottom:16px}
.dch-welcome .dch-hash{display:grid;place-items:center;width:55px;height:55px;border-radius:50%;background:#41434a;color:#fff;font-size:30px;margin-bottom:12px}
.dch-welcome h2{font-size:22px;color:#fff;margin-bottom:4px}
.dch-welcome p{color:#b5bac1;font-size:12px}
.dch-message{display:flex;gap:10px;padding:7px 4px;border-radius:4px}
.dch-message:hover{background:#2e3035}
.dch-avatar{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:#5865f2;color:white;font-size:12px;font-weight:700}
.dch-msg-content{min-width:0;flex:1}
.dch-msg-head{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.dch-msg-head strong{font-size:12px;color:#f2f3f5}
.dch-msg-head time{font-size:10px;color:#949ba4}
.dch-msg-body{color:#dbdee1;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.dch-empty{color:#949ba4;text-align:center;padding:24px;font-size:12px}
.dch-composer-wrap{padding:8px 16px 15px;flex:none}
.dch-compose{display:flex;align-items:flex-end;gap:9px;padding:9px 10px;background:#383a40;border-radius:8px}
.dch-compose textarea{flex:1;min-width:0;max-height:130px;resize:vertical;border:0;outline:0;background:transparent;color:#f2f3f5;user-select:text}
.dch-compose textarea::placeholder{color:#949ba4}
.dch-send{width:32px;height:32px;border:0;border-radius:6px;background:#5865f2;color:#fff;font-size:18px;cursor:pointer}
.dch-send:hover{background:#4752c4}
.dch-compose-help{padding:5px 3px 0;color:#949ba4;font-size:10px}
.dch-members{background:#2b2d31;padding:16px 11px;overflow:auto}
.dch-members h3{font-size:10px;letter-spacing:.08em;color:#949ba4;margin:1px 5px 10px}
.dch-member{display:flex;align-items:center;gap:8px;padding:6px 5px;color:#dbdee1;font-size:11px;overflow:hidden}
.dch-member .dch-avatar{width:27px;height:27px;font-size:10px}
.dch-member-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dch-gate{height:100%;min-height:0;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#3b3d4b,#1e1f22 70%);color:#f2f3f5;overflow:auto}
.dch-card{width:min(100%,460px);padding:25px;background:#2b2d31;border:1px solid #41434a;border-radius:13px;box-shadow:0 16px 48px #0006}
.dch-card h2{font-size:20px;margin-bottom:5px;color:#fff}
.dch-card>p{color:#b5bac1;font-size:12px;margin-bottom:17px}
.dch-brand{display:flex;align-items:center;gap:9px;margin-bottom:16px;color:#fff;font-weight:700}
.dch-brand-mark{width:34px;height:34px;border-radius:11px;background:#5865f2;display:grid;place-items:center}
.dch-field{display:block;color:#c9cbd0;font-size:11px;margin:11px 0 5px}
.dch-input{width:100%;height:38px;padding:0 10px;border:1px solid #45474f;border-radius:6px;background:#1e1f22;color:#fff;outline:none;user-select:text}
.dch-input:focus{border-color:#5865f2}
.dch-primary{height:38px;padding:0 13px;border:0;border-radius:6px;background:#5865f2;color:#fff;font-weight:600;cursor:pointer}
.dch-primary:hover{background:#4752c4}
.dch-setup-submit{width:100%;margin-top:15px}
.dch-note{margin-top:12px;color:#949ba4;font-size:10px;line-height:1.5}
.dch-error{min-height:16px;margin-top:8px;color:#ff8b8b;font-size:11px}
.dch-auth{display:grid;place-items:center;min-height:250px}
.dch-auth-note{color:#b5bac1;font-size:11px;text-align:center;margin:12px 0}
#menu .updater{margin:0 10px 10px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
#menu .updater-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:2px}
#menu .updater-status{min-height:15px;color:var(--dim);font-size:10px;margin:3px 0 7px}
#menu .updater-actions{display:flex;align-items:center;gap:8px}
#menu .updater button,#menu .updater a{font:inherit;font-size:10px}
#menu .updater a{color:var(--accent);text-decoration:none}

style=\"fill: white; width: 16px; height: 16px\"\n          >\n            <path\n              d=\"M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z\"\n            />\n          </svg>\n          Issues & Requests\n        </button>\n        <button class=\"upload-btn\" id=\"upload-btn\">\n          <svg\n            viewBox=\"0 0 24 24\"\n            style=\"fill: white; width: 16px; height: 16px\"\n          >\n            <path d=\"M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z\" />\n          </svg>\n          Upload MP3\n        </button>\n        <input\n          type=\"file\"\n          id=\"file-input\"\n          accept=\".mp3,audio/mpeg\"\n          style=\"display: none\"\n          multiple\n        />\n        <p\n          style=\"\n            opacity: 0.7;\n            color: white;\n            font-family: &quot;Spotify Mix&quot;;\n            margin-right: 5px;\n          \"\n        >\n          made by plankton\n        </p>\n      </div>\n    </header>\n    <main>\n      <div class=\"your-library\">\n        <div class=\"top-thingy\">\n          <p style=\"font-weight: bold\">Your Library</p>\n          <button class=\"create\" id=\"create-btn\">\n            <svg\n              data-encore-id=\"icon\"\n              role=\"img\"\n              aria-hidden=\"true\"\n              class=\"add\"\n              viewBox=\"0 0 16 16\"\n            >\n              <path\n                d=\"M15.25 8a.75.75 0 0 1-.75.75H8.75v5.75a.75.75 0 0 1-1.5 0V8.75H1.5a.75.75 0 0 1 0-1.5h5.75V1.5a.75.75 0 0 1 1.5 0v5.75h5.75a.75.75 0 0 1 .75.75\"\n              ></path>\n            </svg>\n            Create\n          </button>\n        </div>\n        <div id=\"playlists-container\"></div>\n      </div>\n      <div class=\"songs-stuff\" id=\"songs-stuff\">\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">New Additions</h1>\n            <p class=\"show-all-btn\" data-cat=\"new\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-new\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-new\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-new\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">All Artists</h1>\n            <p class=\"show-all-btn\" data-cat=\"artists\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-artists\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-artists\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-artists\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">All Albums & Singles</h1>\n            <p class=\"show-all-btn\" data-cat=\"albums\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-albums\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-albums\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-albums\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n        <div class=\"cat-row\">\n          <div class=\"cat-top\">\n            <h1 class=\"cat-title\">User Uploaded</h1>\n            <p class=\"show-all-btn\" data-cat=\"uploaded\">Show all</p>\n          </div>\n          <div class=\"cards-wrapper\">\n            <button\n              class=\"arrow-btn arrow-left\"\n              data-target=\"cards-uploaded\"\n              disabled\n            >\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\" />\n              </svg>\n            </button>\n            <div class=\"cards\" id=\"cards-uploaded\"></div>\n            <button class=\"arrow-btn arrow-right\" data-target=\"cards-uploaded\">\n              <svg viewBox=\"0 0 24 24\">\n                <path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\" />\n              </svg>\n            </button>\n          </div>\n        </div>\n      </div>\n    </main>\n\n    <script>\n      let allSongsRN = [];\n      let playlists = JSON.parse(\n        localStorage.getItem(\"shittify-playlists\") || \"[]\",\n      );\n      let metaJson = { songs: [], albums: [], profiles: [] };\n      let currentAudio;\n      let allNewSongs = [];\n      // FIX 1: separate full list (unsliced) for \"Show all\" on New Additions\n      let allNewSongsFull = [];\n      let allArtists = [];\n      let allAlbums = [];\n      // FIX 2: separate full shuffled list for \"Show all\" on Albums & Singles\n      let allAlbumsFull = [];\n      let allUploaded = [];\n      let db;\n\n      alert(\n        \"HEY!!! THIS IS IN VERY EARLY BETA, THERE ARENT MANY SONGS/ALBUMS RECCOMEND ME SOME TO ADD IN ISSUES AND REQUESTS IN THE TOP RIGHT, ALSO NOT VERY SIMILAR TO SPOTIFY AS ION USE IT. BTW loading songs on first load will take a while BE PATIENT have fun\",\n      );\n\n      window.addEventListener(\"load\", () => {\n        const splash = document.getElementById(\"splash\");\n        setTimeout(() => {\n          splash.classList.add(\"fade-out\");\n          setTimeout(() => splash.remove(), 650);\n        }, 1400);\n      });\n\n      function savePlaylists() {\n        localStorage.setItem(\"shittify-playlists\", JSON.stringify(playlists));\n      }\n\n      function openDB() {\n        return new Promise((resolve, reject) => {\n          const req = indexedDB.open(\"shittify-uploads\", 1);\n          req.onupgradeneeded = (e) => {\n            const d = e.target.result;\n            if (!d.objectStoreNames.contains(\"songs\")) {\n              d.createObjectStore(\"songs\", { keyPath: \"id\" });\n            }\n          };\n          req.onsuccess = (e) => resolve(e.target.result);\n          req.onerror = (e) => reject(e.target.error);\n        });\n      }\n\n      function dbGetAll() {\n        return new Promise((resolve, reject) => {\n          const tx = db.transaction(\"songs\", \"readonly\");\n          const store = tx.objectStore(\"songs\");\n          const req = store.getAll();\n          req.onsuccess = () => resolve(req.result);\n          req.onerror = (e) => reject(e.target.error);\n        });\n      }\n\n      function dbPut(song) {\n        return new Promise((resolve, reject) => {\n          const tx = db.transaction(\"songs\", \"readwrite\");\n          const store = tx.objectStore(\"songs\");\n          const req = store.put(song);\n          req.onsuccess = () => resolve();\n          req.onerror = (e) => reject(e.target.error);\n        });\n      }\n\n      function setupArrowButtons() {\n        document.querySelectorAll(\".arrow-btn\").forEach((btn) => {\n          btn.addEventListener(\"click\", () => {\n            const targetId = btn.dataset.target;\n            const cards = document.getElementById(targetId);\n            if (!cards) return;\n            const scrollAmount = 191.5 * 3;\n            if (btn.classList.contains(\"arrow-left\")) {\n              cards.scrollLeft -= scrollAmount;\n            } else {\n              cards.scrollLeft += scrollAmount;\n            }\n            setTimeout(() => updateArrowStates(cards), 320);\n          });\n        });\n\n        document.querySelectorAll(\".cards\").forEach((cards) => {\n          cards.addEventListener(\"scroll\", () => updateArrowStates(cards));\n          updateArrowStates(cards);\n        });\n      }\n\n      function updateArrowStates(cards) {\n        const wrapper = cards.closest(\".cards-wrapper\");\n        if (!wrapper) return;\n        const leftBtn = wrapper.querySelector(\".arrow-left\");\n        const rightBtn = wrapper.querySelector(\".arrow-right\");\n        const atStart = cards.scrollLeft <= 2;\n        const atEnd =\n          cards.scrollLeft + cards.clientWidth >= cards.scrollWidth - 2;\n        if (leftBtn) leftBtn.disabled = atStart;\n        if (rightBtn) rightBtn.disabled = atEnd;\n      }\n\n      function shuffle(array) {\n        const arr = [...array];\n        for (let i = arr.length - 1; i > 0; i--) {\n          const j = Math.floor(Math.random() * (i + 1));\n          [arr[i], arr[j]] = [arr[j], arr[i]];\n        }\n        return arr;\n      }\n\n      function mergeArrayBuffers(buffers) {\n        let totalLength = buffers.reduce((sum, b) => sum + b.byteLength, 0);\n        let temp = new Uint8Array(totalLength);\n        let offset = 0;\n        for (let buffer of buffers) {\n          temp.set(new Uint8Array(buffer), offset);\n          offset += buffer.byteLength;\n        }\n        return temp.buffer;\n      }\n\n      function showModal(html, onMount) {\n        const overlay = document.createElement(\"div\");\n        overlay.classList.add(\"modal-overlay\");\n        overlay.innerHTML = `<div class=\"modal-box\">${html}</div>`;\n        document.body.appendChild(overlay);\n        overlay.addEventListener(\"click\", (e) => {\n          if (e.target === overlay) overlay.remove();\n        });\n        if (onMount) onMount(overlay);\n        return overlay;\n      }\n\n      document.getElementById(\"feedback-btn\").addEventListener(\"click\", () => {\n        window.open(\n          \"https://docs.google.com/forms/d/e/1FAIpQLScq-wGpbkjwYh7L9sxC4JLg3wv8s_oSWHl4qgqaH_tRaV0Ymw/viewform?usp=publish-editor\",\n        );\n      });\n\n      function renderPlaylists() {\n        const container = document.getElementById(\"playlists-container\");\n        container.innerHTML = \"\";\n        playlists.forEach((pl, idx) => {\n          const item = document.createElement(\"div\");\n          item.classList.add(\"playlist-item\");\n          const coverEl = buildPlaylistCoverEl(pl, false);\n          const info = document.createElement(\"div\");\n          info.classList.add(\"playlist-info\");\n          const name = document.createElement(\"p\");\n          name.classList.add(\"playlist-name\");\n          name.textContent = pl.name;\n          const count = document.createElement(\"p\");\n          count.classList.add(\"playlist-count\");\n          count.textContent = `Playlist \u00b7 ${pl.songs.length} song${pl.songs.length !== 1 ? \"s\" : \"\"}`;\n          info.appendChild(name);\n          info.appendChild(count);\n\n          const actions = document.createElement(\"div\");\n          actions.classList.add(\"playlist-actions\");\n\n          const renameBtn = document.createElement(\"button\");\n          renameBtn.classList.add(\"playlist-action-btn\");\n          renameBtn.title = \"Rename playlist\";\n          renameBtn.innerHTML = `<svg viewBox=\"0 0 24 24\"><path d=\"M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z\"/></svg>`;\n          renameBtn.addEventListener(\"click\", (e) => {\n            e.stopPropagation();\n            showRenamePlaylistModal(idx);\n          });\n\n          const deleteBtn = document.createElement(\"button\");\n          deleteBtn.classList.add(\"playlist-action-btn\");\n          deleteBtn.title = \"Delete playlist\";\n          deleteBtn.innerHTML = `<svg viewBox=\"0 0 24 24\"><path d=\"M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z\"/></svg>`;\n          deleteBtn.addEventListener(\"click\", (e) => {\n            e.stopPropagation();\n            showDeletePlaylistModal(idx);\n          });\n\n          actions.appendChild(renameBtn);\n          actions.appendChild(deleteBtn);\n\n          item.appendChild(coverEl);\n          item.appendChild(info);\n          item.appendChild(actions);\n          item.addEventListener(\"click\", () => openPlaylistUI(idx));\n          container.appendChild(item);\n        });\n      }\n\n      function showRenamePlaylistModal(idx) {\n        const pl = playlists[idx];\n        const overlay = showModal(\n          `\n          <h2>Rename playlist</h2>\n          <input class=\"modal-input\" id=\"rename-input\" placeholder=\"Playlist name\" maxlength=\"60\" value=\"${pl.name.replace(/\"/g, \"&quot;\")}\" />\n          <div class=\"modal-actions\">\n            <button class=\"modal-cancel\" id=\"rename-cancel\">Cancel</button>\n            <button class=\"modal-confirm\" id=\"rename-confirm\">Save</button>\n          </div>\n        `,\n          (o) => {\n            const input = o.querySelector(\"#rename-input\");\n            input.focus();\n            input.select();\n            o.querySelector(\"#rename-cancel\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelector(\"#rename-confirm\").addEventListener(\"click\", () => {\n              const n = input.value.trim();\n              if (!n) return;\n              playlists[idx].name = n;\n              savePlaylists();\n              renderPlaylists();\n              const titleDisplay = document.getElementById(\"pl-title-display\");\n              if (titleDisplay) titleDisplay.textContent = n;\n              o.remove();\n            });\n            input.addEventListener(\"keydown\", (e) => {\n              if (e.key === \"Enter\") o.querySelector(\"#rename-confirm\").click();\n            });\n          },\n        );\n      }\n\n      function showDeletePlaylistModal(idx) {\n        const pl = playlists[idx];\n        showModal(\n          `\n          <h2>Delete \"${pl.name}\"?</h2>\n          <p style=\"color:rgb(182,182,182);font-size:14px;margin:0;\">This will permanently delete the playlist. This cannot be undone.</p>\n          <div class=\"modal-actions\">\n            <button class=\"modal-cancel\" id=\"delete-cancel\">Cancel</button>\n            <button class=\"modal-confirm-danger\" id=\"delete-confirm\">Delete</button>\n          </div>\n        `,\n          (o) => {\n            o.querySelector(\"#delete-cancel\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelector(\"#delete-confirm\").addEventListener(\"click\", () => {\n              playlists.splice(idx, 1);\n              savePlaylists();\n              renderPlaylists();\n              const songsStuff = document.getElementById(\"songs-stuff\");\n              if (songsStuff && songsStuff.classList.contains(\"red-stuff\")) {\n                showHome();\n              }\n              o.remove();\n            });\n          },\n        );\n      }\n\n      function buildPlaylistCoverEl(pl, big) {\n        const size = big ? 232 : 48;\n        const covers = pl.songs.map((s) => s.cover).filter(Boolean);\n        const unique = [...new Set(covers)];\n        if (unique.length === 0) {\n          const wrap = document.createElement(\"div\");\n          wrap.classList.add(big ? \"playlist-big-cover\" : \"playlist-cover\");\n          wrap.style.width = size + \"px\";\n          wrap.style.height = size + \"px\";\n          wrap.innerHTML = big\n            ? `<svg class=\"playlist-empty-icon-big\" viewBox=\"0 0 24 24\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`\n            : `<svg class=\"playlist-cover-empty-icon\" viewBox=\"0 0 24 24\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`;\n          return wrap;\n        }\n        if (unique.length < 4 || !big) {\n          const wrap = document.createElement(\"div\");\n          wrap.classList.add(\"playlist-cover\");\n          wrap.style.width = size + \"px\";\n          wrap.style.height = size + \"px\";\n          const img = document.createElement(\"img\");\n          img.src = unique[0];\n          img.style.cssText =\n            \"width:100%;height:100%;object-fit:cover;border-radius:4px;\";\n          wrap.appendChild(img);\n          return wrap;\n        }\n        const grid = document.createElement(\"div\");\n        grid.classList.add(\n          big ? \"playlist-big-cover-grid\" : \"playlist-cover-grid\",\n        );\n        unique.slice(0, 4).forEach((src) => {\n          const img = document.createElement(\"img\");\n          img.src = src;\n          grid.appendChild(img);\n        });\n        return grid;\n      }\n\n      document.getElementById(\"create-btn\").addEventListener(\"click\", () => {\n        const overlay = showModal(\n          `\n          <h2>Name your playlist</h2>\n          <input class=\"modal-input\" id=\"playlist-name-input\" placeholder=\"My playlist\" maxlength=\"60\" />\n          <div class=\"modal-actions\">\n            <button class=\"modal-cancel\" id=\"modal-cancel-btn\">Cancel</button>\n            <button class=\"modal-confirm\" id=\"modal-confirm-btn\">Create</button>\n          </div>\n        `,\n          (o) => {\n            const input = o.querySelector(\"#playlist-name-input\");\n            input.focus();\n            o.querySelector(\"#modal-cancel-btn\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelector(\"#modal-confirm-btn\").addEventListener(\n              \"click\",\n              () => {\n                const n = input.value.trim();\n                if (!n) return;\n                playlists.push({ name: n, songs: [] });\n                savePlaylists();\n                renderPlaylists();\n                o.remove();\n              },\n            );\n            input.addEventListener(\"keydown\", (e) => {\n              if (e.key === \"Enter\")\n                o.querySelector(\"#modal-confirm-btn\").click();\n            });\n          },\n        );\n      });\n\n      function openPlaylistUI(idx) {\n        const pl = playlists[idx];\n        allSongsRN = pl.songs;\n        const songsStuff = document.querySelector(\".songs-stuff\");\n        songsStuff.classList.add(\"red-stuff\");\n        songsStuff.scrollTop = 0;\n        const coverEl = buildPlaylistCoverEl(pl, true);\n        coverEl.id = \"playlist-big-cover-el\";\n        songsStuff.innerHTML = \"\";\n        const topInfo = document.createElement(\"div\");\n        topInfo.classList.add(\"top-player-info\");\n        const actualInfo = document.createElement(\"div\");\n        actualInfo.classList.add(\"top-actual-info\");\n        actualInfo.innerHTML = `\n          <h1 class=\"huge-title\" id=\"pl-title-display\">${pl.name}</h1>\n          <p class=\"artist-clicky\">Playlist \u00b7 ${pl.songs.length} song${pl.songs.length !== 1 ? \"s\" : \"\"}</p>\n        `;\n        topInfo.appendChild(coverEl);\n        topInfo.appendChild(actualInfo);\n        songsStuff.appendChild(topInfo);\n        const playOptions = document.createElement(\"div\");\n        playOptions.classList.add(\"play-options\");\n        playOptions.innerHTML = `\n          <button class=\"big-play\" id=\"pl-big-play\">\n            <svg data-encore-id=\"icon\" role=\"img\" aria-hidden=\"true\" class=\"play-icon-but-cool\" viewBox=\"0 0 16 16\">\n              <path d=\"M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288z\"></path>\n            </svg>\n          </button>\n        `;\n        songsStuff.appendChild(playOptions);\n        const songsInAlbumWrap = document.createElement(\"div\");\n        songsInAlbumWrap.classList.add(\"songs-in-album\");\n        songsInAlbumWrap.innerHTML = `<div class=\"album-header\"><p class=\"hash\">#</p><p class=\"title-sayer\">Title</p></div>`;\n        const songsPlace = document.createElement(\"div\");\n        songsPlace.classList.add(\"songs-place2\");\n        songsPlace.id = \"pl-songs-place\";\n        songsInAlbumWrap.appendChild(songsPlace);\n        songsStuff.appendChild(songsInAlbumWrap);\n        document\n          .getElementById(\"pl-big-play\")\n          .addEventListener(\"click\", async () => {\n            if (pl.songs.length > 0) await playAnySong(pl.songs[0]);\n          });\n        renderPlaylistSongs(idx);\n      }\n\n      function renderPlaylistSongs(idx) {\n        const pl = playlists[idx];\n        const songsPlace = document.getElementById(\"pl-songs-place\");\n        if (!songsPlace) return;\n        songsPlace.innerHTML = \"\";\n        allSongsRN = pl.songs;\n        if (pl.songs.length === 0) {\n          const empty = document.createElement(\"p\");\n          empty.style.cssText = \"opacity:0.5;margin:20px 0;font-size:14px;\";\n          empty.textContent =\n            \"No songs yet. Add some using the + button on any song.\";\n          songsPlace.appendChild(empty);\n          return;\n        }\n        pl.songs.forEach((ssong, si) => {\n          const singleSong = document.createElement(\"div\");\n          singleSong.classList.add(\"song56\");\n          singleSong.innerHTML = `\n            <div class=\"song56-left\">\n              <p class=\"song-number\">${si + 1}</p>\n              <p class=\"song-title-small\">${ssong.title}</p>\n            </div>\n            <div class=\"songs56-right\">\n              <button class=\"add-to-album\" title=\"Remove from playlist\" data-remove=\"${si}\">\n                <svg viewBox=\"0 0 24 24\" style=\"fill:rgb(136,136,136);width:20px;height:20px;\"><path d=\"M19 13H5v-2h14v2z\"/></svg>\n              </button>\n            </div>\n          `;\n          singleSong.addEventListener(\"click\", async (e) => {\n            if (e.target.closest(\"[data-remove]\")) {\n              const removeIdx = parseInt(\n                e.target.closest(\"[data-remove]\").dataset.remove,\n              );\n              pl.songs.splice(removeIdx, 1);\n              savePlaylists();\n              renderPlaylists();\n              renderPlaylistSongs(idx);\n              return;\n            }\n            await playAnySong(ssong);\n          });\n          songsPlace.appendChild(singleSong);\n        });\n      }\n\n      function showAddToPlaylistModal(song) {\n        if (playlists.length === 0) {\n          showModal(\n            `\n            <h2>No playlists yet</h2>\n            <p style=\"color:rgb(182,182,182);font-size:14px;margin:0;\">Create a playlist first using the Create button.</p>\n            <div class=\"modal-actions\"><button class=\"modal-confirm\" id=\"modal-ok-btn\">Got it</button></div>\n          `,\n            (o) => {\n              o.querySelector(\"#modal-ok-btn\").addEventListener(\"click\", () =>\n                o.remove(),\n              );\n            },\n          );\n          return;\n        }\n        const listHTML = playlists\n          .map((pl, i) => {\n            const alreadyAdded = pl.songs.some((s) => s.id === song.id);\n            return `\n            <div class=\"add-song-modal-item${alreadyAdded ? \" already-added\" : \"\"}\" data-pl-idx=\"${i}\">\n              <div style=\"width:40px;height:40px;border-radius:4px;background:#2c2c2c;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;\">\n                ${pl.songs[0] ? `<img src=\"${pl.songs[0].cover || \"\"}\" style=\"width:100%;height:100%;object-fit:cover;\" />` : `<svg viewBox=\"0 0 24 24\" style=\"fill:#888;width:18px;height:18px;\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`}\n              </div>\n              <div class=\"add-song-modal-item-info\">\n                <span class=\"add-song-modal-item-title\">${pl.name}</span>\n                <span class=\"add-song-modal-item-artist\">${pl.songs.length} song${pl.songs.length !== 1 ? \"s\" : \"\"}${alreadyAdded ? \" \u00b7 Already added\" : \"\"}</span>\n              </div>\n            </div>\n          `;\n          })\n          .join(\"\");\n        showModal(\n          `\n          <h2>Add to playlist</h2>\n          <div class=\"add-song-modal-list\">${listHTML}</div>\n          <div class=\"modal-actions\"><button class=\"modal-cancel\" id=\"modal-cancel-btn\">Cancel</button></div>\n        `,\n          (o) => {\n            o.querySelector(\"#modal-cancel-btn\").addEventListener(\"click\", () =>\n              o.remove(),\n            );\n            o.querySelectorAll(\n              \".add-song-modal-item:not(.already-added)\",\n            ).forEach((el) => {\n              el.addEventListener(\"click\", () => {\n                const plIdx = parseInt(el.dataset.plIdx);\n                playlists[plIdx].songs.push(song);\n                savePlaylists();\n                renderPlaylists();\n                o.remove();\n              });\n            });\n          },\n        );\n      }\n\n      async function playAnySong(song) {\n        if (song.uploadedBlob) {\n          const audio = new Audio(song.uploadedBlob);\n          songUI(audio, song);\n        } else {\n          await fetchMP3(song);\n        }\n      }\n\n      async function fetchMetaStuff() {\n        const res = await fetch(\n          \"https://cdn.jsdelivr.net/gh/DSMOnVR/shittifylol@master/meta.json\",\n          { cache: \"no-store\" },\n        );\n\n        if (!res.ok) {\n          console.error(\"couldn't get meta.json\");\n          return null;\n        }\n\n        return await res.json();\n      }\n\n      async function loadUploaded() {\n        const rows = await dbGetAll();\n        allUploaded = rows;\n        renderUploadedCards();\n      }\n\n      function renderUploadedCards() {\n        const container = document.getElementById(\"cards-uploaded\");\n        if (!container) return;\n        container.innerHTML = \"\";\n        allUploaded.forEach((song) => {\n          container.appendChild(makeUploadedCard(song));\n        });\n        const wrapper = container.closest(\".cards-wrapper\");\n        if (wrapper) {\n          setTimeout(() => updateArrowStates(container), 50);\n        }\n      }\n\n      function makeUploadedCard(song) {\n        const card = document.createElement(\"div\");\n        card.classList.add(\"card\");\n        const img = document.createElement(\"div\");\n        img.style.cssText =\n          \"width:151.5px;height:151.5px;border-radius:5px;background:#2c2c2c;display:flex;align-items:center;justify-content:center;\";\n        img.innerHTML = `<svg viewBox=\"0 0 24 24\" style=\"fill:#888;width:48px;height:48px;\"><path d=\"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\"/></svg>`;\n        const name = document.createElement(\"p\");\n        name.textContent = song.title;\n        name.classList.add(\"song-name\");\n        const artistName = document.createElement(\"p\");\n        artistName.textContent = \"You\";\n        artistName.classList.add(\"artist-name\");\n        card.appendChild(img);\n        card.appendChild(name);\n        card.appendChild(artistName);\n        card.addEventListener(\"click\", () => {\n          allSongsRN = allUploaded;\n          playAnySong(song);\n        });\n        return card;\n      }\n\n      document.getElementById(\"upload-btn\").addEventListener(\"click\", () => {\n        alert(\"these uploaded songs ONLY appear for u\");\n        document.getElementById(\"file-input\").click();\n      });\n\n      document\n        .getElementById(\"file-input\")\n        .addEventListener(\"change\", async (e) => {\n          const files = Array.from(e.target.files);\n          for (const file of files) {\n            const reader = new FileReader();\n            reader.onload = async (ev) => {\n              const blobUrl = URL.createObjectURL(file);\n              const id =\n                \"upload-\" +\n                Date.now() +\n                \"-\" +\n                Math.random().toString(36).slice(2);\n              const song = {\n                id,\n                title: file.name.replace(/\\.mp3$/i, \"\"),\n                artist: \"You\",\n                cover: null,\n                uploadedBlob: blobUrl,\n                uploadedData: ev.target.result,\n                parts: 1,\n                album: \"single\",\n              };\n              await dbPut(song);\n              allUploaded.push(song);\n              renderUploadedCards();\n            };\n            reader.readAsArrayBuffer(file);\n          }\n          e.target.value = \"\";\n        });\n\n      function makeCard(song, onClick) {\n        const card = document.createElement(\"div\");\n        card.classList.add(\"card\");\n        const img = document.createElement(\"img\");\n        card.setAttribute(\"title\", song.name || song.title);\n        img.src = song.cover || \"\";\n        img.classList.add(\"title\");\n        const name = document.createElement(\"p\");\n        name.textContent = song.name || song.title;\n        name.classList.add(\"song-name\");\n        const artistName = document.createElement(\"p\");\n        artistName.textContent = song.artist || \"\";\n        artistName.classList.add(\"artist-name\");\n        card.appendChild(img);\n        card.appendChild(name);\n        card.appendChild(artistName);\n        card.addEventListener(\"click\", onClick);\n        return card;\n      }\n\n      function makeArtistCard(profile, onClick) {\n        const card = document.createElement(\"div\");\n        card.classList.add(\"card\");\n        const artistPfp = document.createElement(\"img\");\n        artistPfp.classList.add(\"artist\");\n        artistPfp.src = profile.image;\n        const artistName = document.createElement(\"p\");\n        artistName.classList.add(\"song-name\");\n        artistName.textContent = profile.name;\n        card.appendChild(artistPfp);\n        card.appendChild(artistName);\n        card.addEventListener(\"click\", onClick);\n        return card;\n      }\n\n      function showHome() {\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.outerHTML = `\n          <div class=\"songs-stuff\" id=\"songs-stuff\">\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">New Additions</h1><p class=\"show-all-btn\" data-cat=\"new\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-new\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-new\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-new\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">All Artists</h1><p class=\"show-all-btn\" data-cat=\"artists\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-artists\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-artists\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-artists\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">All Albums & Singles</h1><p class=\"show-all-btn\" data-cat=\"albums\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-albums\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-albums\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-albums\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n            <div class=\"cat-row\">\n              <div class=\"cat-top\"><h1 class=\"cat-title\">User Uploaded</h1><p class=\"show-all-btn\" data-cat=\"uploaded\">Show all</p></div>\n              <div class=\"cards-wrapper\">\n                <button class=\"arrow-btn arrow-left\" data-target=\"cards-uploaded\" disabled><svg viewBox=\"0 0 24 24\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/></svg></button>\n                <div class=\"cards\" id=\"cards-uploaded\"></div>\n                <button class=\"arrow-btn arrow-right\" data-target=\"cards-uploaded\"><svg viewBox=\"0 0 24 24\"><path d=\"M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z\"/></svg></button>\n              </div>\n            </div>\n          </div>\n        `;\n        setupArrowButtons();\n        populateHomeSections();\n        renderUploadedCards();\n        attachShowAllListeners();\n      }\n\n      function resolveAlbumCover(songOrAlbum) {\n        if (songOrAlbum.cover) return songOrAlbum.cover;\n        const albumName = songOrAlbum.album || songOrAlbum.name;\n        if (albumName && albumName !== \"single\") {\n          const found = metaJson.albums.find((a) => a.name === albumName);\n          if (found && found.cover) return found.cover;\n        }\n        return \"\";\n      }\n\n      function populateHomeSections() {\n        const WEEK_MS = 7 * 24 * 60 * 60 * 1000;\n\n        // FIX 1: build the full unsliced new-additions list first, then slice 12 for the home row\n        allNewSongsFull = Array.from(\n          new Map(\n            metaJson.songs\n              .filter((song) => {\n                const diff = Date.now() - new Date(song.dateAdded).getTime();\n                return diff >= 0 && diff <= WEEK_MS;\n              })\n              .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))\n              .map((song) => {\n                const displayName =\n                  song.album === \"single\" ? song.title : song.album;\n                const cover = resolveAlbumCover(song);\n                return [\n                  displayName,\n                  {\n                    id: song.id,\n                    name: displayName,\n                    cover,\n                    artist: song.artist,\n                    album: song.album,\n                    parts: song.parts,\n                    title: song.title,\n                  },\n                ];\n              }),\n          ).values(),\n        );\n        allNewSongs = allNewSongsFull.slice(0, 12);\n\n        allArtists = shuffle(metaJson.profiles);\n\n        // FIX 2: build the full shuffled albums list, then slice 12 for the home row\n        allAlbumsFull = shuffle(\n          Array.from(\n            new Map([\n              ...metaJson.songs.map((song) => {\n                const displayName =\n                  song.album === \"single\" ? song.title : song.album;\n                const cover = resolveAlbumCover(song);\n                return [\n                  displayName,\n                  {\n                    id: song.id,\n                    title: song.title,\n                    name: displayName,\n                    album: song.album,\n                    artist: song.artist,\n                    cover,\n                    parts: song.parts,\n                    dateAdded: song.dateAdded,\n                    isAlbum: false,\n                  },\n                ];\n              }),\n              ...metaJson.albums.map((album) => [\n                album.name,\n                {\n                  id: album.id,\n                  title: album.name,\n                  name: album.name,\n                  album: album.name,\n                  artist: album.artist || null,\n                  cover: album.cover,\n                  parts: album.parts || [],\n                  dateAdded: album.dateAdded || null,\n                  isAlbum: true,\n                },\n              ]),\n            ]).values(),\n          ),\n        );\n        allAlbums = allAlbumsFull.slice(0, 12);\n\n        const newContainer = document.getElementById(\"cards-new\");\n        const artistsContainer = document.getElementById(\"cards-artists\");\n        const albumsContainer = document.getElementById(\"cards-albums\");\n\n        allNewSongs.forEach((song) => {\n          newContainer.appendChild(makeCard(song, () => openSong(song)));\n        });\n\n        allArtists.forEach((profile) => {\n          artistsContainer.appendChild(\n            makeArtistCard(profile, () => openArtistPage(profile)),\n          );\n        });\n\n        allAlbums.forEach((song) => {\n          albumsContainer.appendChild(makeCard(song, () => openSong(song)));\n        });\n\n        setTimeout(() => {\n          document\n            .querySelectorAll(\".cards\")\n            .forEach((c) => updateArrowStates(c));\n        }, 100);\n      }\n\n      function attachShowAllListeners() {\n        document.querySelectorAll(\".show-all-btn\").forEach((btn) => {\n          btn.addEventListener(\"click\", () => {\n            const cat = btn.dataset.cat;\n            openShowAll(cat);\n          });\n        });\n      }\n\n      function openShowAll(cat) {\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.className = \"songs-stuff\";\n        songsStuff.scrollTop = 0;\n        songsStuff.innerHTML = \"\";\n\n        const backBtn = document.createElement(\"button\");\n        backBtn.style.cssText =\n          \"background:transparent;border:none;color:white;font-family:'Spotify Mix';font-size:14px;cursor:pointer;opacity:0.7;margin-bottom:10px;padding:0;\";\n        backBtn.textContent = \"\u2190 Back\";\n        backBtn.addEventListener(\"click\", showHome);\n        songsStuff.appendChild(backBtn);\n\n        const title = document.createElement(\"h1\");\n        title.style.cssText = \"font-size:2rem;margin-bottom:20px;\";\n\n        const grid = document.createElement(\"div\");\n        grid.classList.add(\"show-all-grid\");\n\n        if (cat === \"new\") {\n          title.textContent = \"New Additions\";\n          songsStuff.appendChild(title);\n          // FIX 1: use allNewSongsFull so all new songs are shown, not just 12\n          allNewSongsFull.forEach((song) =>\n            grid.appendChild(makeCard(song, () => openSong(song))),\n          );\n        } else if (cat === \"artists\") {\n          title.textContent = \"All Artists\";\n          songsStuff.appendChild(title);\n          allArtists.forEach((profile) =>\n            grid.appendChild(\n              makeArtistCard(profile, () => openArtistPage(profile)),\n            ),\n          );\n        } else if (cat === \"albums\") {\n          title.textContent = \"All Albums & Singles\";\n          songsStuff.appendChild(title);\n          // FIX 2: use allAlbumsFull (already shuffled) instead of rebuilding unshuffled\n          allAlbumsFull.forEach((song) =>\n            grid.appendChild(makeCard(song, () => openSong(song))),\n          );\n        } else if (cat === \"uploaded\") {\n          title.textContent = \"User Uploaded\";\n          songsStuff.appendChild(title);\n          allUploaded.forEach((song) => {\n            const card = makeUploadedCard(song);\n            grid.appendChild(card);\n          });\n        }\n\n        songsStuff.appendChild(grid);\n      }\n\n      function openArtistPage(profile) {\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.className = \"songs-stuff red-stuff\";\n        songsStuff.scrollTop = 0;\n        songsStuff.innerHTML = \"\";\n\n        const backBtn = document.createElement(\"button\");\n        backBtn.style.cssText =\n          \"background:transparent;border:none;color:white;font-family:'Spotify Mix';font-size:14px;cursor:pointer;opacity:0.7;margin-bottom:10px;padding:0;\";\n        backBtn.textContent = \"\u2190 Back\";\n        backBtn.addEventListener(\"click\", showHome);\n        songsStuff.appendChild(backBtn);\n\n        const header = document.createElement(\"div\");\n        header.classList.add(\"artist-page-header\");\n\n        const img = document.createElement(\"img\");\n        img.src = profile.image;\n        img.classList.add(\"artist-page-img\");\n\n        const nameEl = document.createElement(\"h1\");\n        nameEl.classList.add(\"artist-page-name\");\n        nameEl.textContent = profile.name;\n\n        header.appendChild(img);\n        header.appendChild(nameEl);\n        songsStuff.appendChild(header);\n\n        const artistSongs = metaJson.songs.filter(\n          (s) => s.ar ist);\n\n          if (artistAlbums.length > 0) {\n            const albumsTitle = document.createElement(\"h2\");\n            albumsTitle.textContent = \"Albums\";\n            albumsTitle.style.cssText =\n              \"font-size:1.3rem;margin-top:20px;margin-bottom:10px;\";\n            songsStuff.appendChild(albumsTitle);\n            const albumGrid = document.createElement(\"div\");\n            albumGrid.classList.add(\"show-all-grid\");\n            artistAlbums.forEach((album) => {\n              albumGrid.appendChild(\n                makeCard(\n                  {\n                    name: album.name,\n                    cover: album.cover,\n                    artist: album.artist,\n                  },\n                  () => openSong(album),\n                ),\n              );\n            });\n            songsStuff.appendChild(albumGrid);\n          }\n        } else {\n          const empty = document.createElement(\"p\");\n          empty.style.cssText = \"opacity:0.5;margin-top:20px;\";\n          empty.textContent = \"No songs found for this artist.\";\n          songsStuff.appendChild(empty);\n        }\n      }\n\n      function openSearchResults(query) {\n        const q = query.toLowerCase();\n        const songsStuff = document.getElementById(\"songs-stuff\");\n        songsStuff.className = \"songs-stuff\";\n        songsStuff.scrollTop = 0;\n        songsStuff.innerHTML = \"\";\n\n        const title = document.createElement(\"h1\");\n        title.style.cssText = \"font-size:1.8rem;margin-bottom:20px;\";\n        title.textContent = `Results for \"${query}\"`;\n        songsStuff.appendChild(title);\n\n        const matchedSongs = metaJson.songs.filter(\n          (s) =>\n            s.title.toLowerCase().includes(q) ||\n            s.artist.toLowerCase().includes(q) ||\n            (s.album && s.album.toLowerCase().includes(q)),\n        );\n        const matchedArtists = metaJson.profiles.filter((p) =>\n          p.name.toLowerCa
