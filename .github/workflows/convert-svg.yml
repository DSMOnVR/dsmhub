name: Convert index.html to index.svg

on:
  push:
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate index.svg
        run: python convert.py

      - name: Commit and push updated index.svg
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.svg
          if git diff --staged --quiet; then
            echo "No changes to index.svg"
          else
            git commit -m "Auto-generate index.svg from index.html [skip ci]"
            git push
          fi
